name: Build APK

on:
  push:
    branches: [ main, master, 'claude/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Get APK info
      run: |
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
        echo "Built APK size: $APK_SIZE"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: indieradio-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build summary
      run: |
        echo "### ✅ Build Successful! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**APK Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- Size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- Package: com.indieradio.debug" >> $GITHUB_STEP_SUMMARY
        echo "- Min SDK: 24 (Android 7.0)" >> $GITHUB_STEP_SUMMARY
        echo "- Target SDK: 35 (Android 15)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 Download the APK from the **Artifacts** section above" >> $GITHUB_STEP_SUMMARY
